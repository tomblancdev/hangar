# A hangar with nothing to install: one zone on the fake engine, the toy
# plugin, two tiers. Try it:
#
#   hangar token create --config example/hangar.yaml --subject alice \
#       --groups example-users --name try
#   hangar serve --config example/hangar.yaml
#
# then, with the token printed by the first command:
#
#   curl -H "Authorization: Bearer $TOKEN" localhost:8080/v1/types
#   curl -H "Authorization: Bearer $TOKEN" -X POST localhost:8080/v1/resources \
#       -d '{"type":"box","zone":"playground","spec":{"cores":2}}'
#   curl -H "Authorization: Bearer $TOKEN" -X POST localhost:8080/v1/resources \
#       -d '{"type":"machine","zone":"playground","spec":{"image":"debian-13","type":"t3.small"}}'
#
# or the same binary as the command line (docs/cli.md):
#
#   HANGAR_URL=http://localhost:8080 HANGAR_TOKEN=$TOKEN hangar box create --cores 2
#
# A real engine is a zone with another driver: docs/proxmox.md shows a
# Proxmox VE zone, and what its token must — and must not — be allowed.

listen: ":8080"
data_dir: ./data
house: ""                     # your word for the mark; empty = the product's own

identity:
  # oidc:                     # the identity provider people already sign in with
  #   issuer: https://id.example.com/application/o/hangar/
  #   audience: hangar        # the client id its tokens are issued to — a public
  #                           #   client with the device flow on: `hangar login` signs in with it
  #   groups_claim: groups
  #   scopes: [openid, profile, offline_access]   # what `hangar login` asks for: the groups, a refresh token
  tokens:
    max_ttl: 720h

# The FIRST tier whose groups a person is in is theirs: most to least.
tiers:
  - name: operators
    groups: [example-operators]
    operator: true             # sees and acts on everyone's resources
    zones: ["*"]
    limits:
      "*": unlimited
  - name: users
    groups: [example-users]
    zones: [playground]
    limits:
      toy.boxes: 2             # a dimension a tier does not name, it gets none of
      toy.cores: 4
      toy.memory_gb: 8
      toy.kind: [container]    # a choice: the values allowed
      machines.count: 2
      machines.vcpu: 4
      machines.memory_gb: 8
      machines.disk_gb: 32
      machines.key_pairs: 2
      machines.kind: [vm]      # untrusted people get VMs: their own kernel
      machines.class: [spot]
      volumes.count: 2
      volumes.size_gb: 20
      volumes.backup_gb: 5     # backups are a size: a tier that names none backs up nothing
      images.count: 2          # images of their own
      images.size_gb: 40
      images.source: [machine] # they save their stopped machines; baking a recipe stays the operators'
      images.visibility: [private, shared]   # shared with groups they are in; never with everyone

zones:
  - name: playground
    driver: fake
    endpoint: ./data/playground.json   # the fake engine's state: edit it to make it drift
    options:
      capabilities: kind.container,kind.vm,guest.tags,resize.live.cpu_cap,fence.pool,volume.move_between_guests
    # room:                    # count the zone's memory in two pools (ARCHITECTURE.md §6)
    #   memory_gb: 16          #   what its resources may count on
    #   reservations:          #   room kept for others: always, or on a condition
    #     - {name: host, memory_gb: 2}
    #     - {name: priority, memory_gb: 8, while_running: "4100"}   # a guest of yours
    #                          #   → 6 GB can be promised, 8 lent while guest 4100 sleeps
    #                          #   (the fake engine: "watched": {"4100": true} in its file)
    # wake:                    # a zone that sleeps, woken before anything starts in it
    #   url: https://power.example.com/api/targets/node-c/wake
    #   headers: {Authorization: {env: WAKE_TOKEN}}

plugins:
  - name: toy
    builtin: toy
    zones: [playground]
  - name: machines
    builtin: machines
    zones: [playground]
    settings:
      images:                  # a name people ask for → the engine's own, per kind
        debian-13: {vm: debian-13, container: "local:vztmpl/debian-13-standard.tar.zst"}
      types:                   # aliases beside AWS's names (t3.micro … r5.2xlarge)
        dev: {cores: 4, memory_gb: 8}
  - name: volumes              # disks of their own: attach, detach, move, grow
    builtin: volumes
    zones: [playground]
  - name: images               # system disks machines are born from (a machine's image_id)
    builtin: images
    zones: [playground]
    settings:
      recipes:                 # what an operator bakes: a base on the engine + a first boot
        debian-13:
          base: {vm: "local:import/debian-13-genericcloud-amd64.qcow2"}   # the engine's own name, per kind
          disk_gb: 4
          memory_mb: 2048      # its builder's, borrowed from the zone's spot room while it bakes
          timeout: 30m
          user_data: |         # no secret here: whoever sees an image sees its recipe
            #cloud-config
            package_update: true
            package_upgrade: true
            packages: [qemu-guest-agent]

# Requests the brain makes by itself, on a clock (ARCHITECTURE.md §3): the
# recipe baked again every Sunday, in the operators' name and within their
# tier, shared with everyone. A machine asks for image_id "@debian-13" and is
# born from the newest usable one; once two newer are usable, an older one is
# retired, then deleted when no machine is born from it any more. A recipe no
# schedule names is baked only when someone asks.
schedules:
  - name: debian-13
    cron: "0 3 * * sun"        # minute hour day-of-month month day-of-week
    time_zone: UTC
    as: {subject: recipes, groups: [example-operators]}   # whose name, whose tier
    create: {type: image, zone: playground, spec: {recipe: debian-13, shared_with: ["*"]}}
    keep: 2                    # the newest usable ones, as they are
    retire: retire             # what an older one is given first

reconcile:
  every: 30s
